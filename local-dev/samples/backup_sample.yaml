apiVersion: v1
kind: Secret
metadata:
  name: appdb-credentials
stringData:
  host: postgres.default.svc.cluster.local
  port: "5432"
  user: postgres
  password: postgres
  dbname: appdb
---
apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials
stringData:
  accessKeyId: minioadmin
  secretAccessKey: minioadmin
---
apiVersion: backup.xol1ren.io/v1alpha1
kind: PostgresBackup
metadata:
  name: appdb-nightly
spec:
  databaseUriSecretRef:
    name: appdb-credentials
  schedule: "0 2 * * *"
  retentionDays: 7
  compression: gzip
  storage:
    endpoint: http://minio.default.svc.cluster.local:9000
    bucket: pg-backups
    region: us-east-1
    forcePathStyle: true
    credentialSecretRef:
      name: s3-credentials

