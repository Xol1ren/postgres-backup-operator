apiVersion: v1
kind: Secret
metadata:
  name: restore-target-credentials
stringData:
  host: postgres-restore.default.svc.cluster.local
  port: "5432"
  user: postgres
  password: postgres
  dbname: appdb_restored
---
apiVersion: backup.xol1ren.io/v1alpha1
kind: PostgresRestore
metadata:
  name: appdb-restore
spec:
  # Restore the latest successful backup of this PostgresBackup...
  backupName: appdb-nightly
  # ...or the newest one taken at or before a point in time (snapshot granularity):
  # pitrTimestamp: "2026-10-14T12:00:00Z"
  targetDatabaseUriSecretRef:
    name: restore-target-credentials

