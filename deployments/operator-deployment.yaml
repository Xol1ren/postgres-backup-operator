apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-backup-operator
  namespace: postgres-backup-system
  labels:
    app.kubernetes.io/name: postgres-backup-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-backup-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-backup-operator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: postgres-backup-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/xol1ren/postgres-backup-operator:latest
          args:
            - --leader-elect
            - --runner-image=ghcr.io/xol1ren/postgres-backup-runner:latest
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-backup-operator-metrics
  namespace: postgres-backup-system
spec:
  selector:
    app.kubernetes.io/name: postgres-backup-operator
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics

