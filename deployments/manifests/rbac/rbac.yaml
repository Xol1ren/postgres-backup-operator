apiVersion: v1
kind: Namespace
metadata:
  name: postgres-backup-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-backup-operator
  namespace: postgres-backup-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: postgres-backup-operator
rules:
  - apiGroups: ["backup.xol1ren.io"]
    resources: ["postgresbackups", "postgresrestores"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["backup.xol1ren.io"]
    resources: ["postgresbackups/status", "postgresrestores/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # Secrets are read through an uncached client: `get` only, no list/watch.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: postgres-backup-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: postgres-backup-operator
subjects:
  - kind: ServiceAccount
    name: postgres-backup-operator
    namespace: postgres-backup-system
---
# Leader election (only needed when running with --leader-elect).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgres-backup-operator-leader-election
  namespace: postgres-backup-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgres-backup-operator-leader-election
  namespace: postgres-backup-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: postgres-backup-operator-leader-election
subjects:
  - kind: ServiceAccount
    name: postgres-backup-operator
    namespace: postgres-backup-system

